name: Android Pull Request Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  online-debug-check:
    name: Compile and test Online Debug (no signing secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Download and verify Online runtime bundle
        shell: bash
        run: |
          set -euo pipefail

          FILE="pocketdev-agy-arm64-2026.09.1.tar.zst"
          BASE_URL="https://github.com/techjarves/Mobile-Harness/releases/download/runtime-2026.09.4"
          mkdir -p dist/runtime-bundles

          curl --fail --location --retry 3 \
            "$BASE_URL/$FILE" \
            --output "dist/runtime-bundles/$FILE"

          EXPECTED_SHA="a659ab9188956fc4721ca86fb21b5118e0e489f47a5e02ae6b4f2fb423659d78"
          echo "$EXPECTED_SHA  dist/runtime-bundles/$FILE" | sha256sum --check

      - name: Run Online Debug unit tests and compile APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:testOnlineDebugUnitTest \
            :app:assembleOnlineDebug
